<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>ไม่พบหน้านี้ | บริษัท เกษรถาวร จำกัด</title>
<meta content="noindex" name="robots"/>
<link href="/favicon.ico" rel="icon" sizes="32x32"/>
<link href="/apple-touch-icon.png" rel="apple-touch-icon"/>
<style>
:root{ --bg:#EEF1F4; --surface:#fff; --ink:#18212B; --muted:#56626F; --blue:#006AA7; --yellow:#FECC02; color-scheme:light; }
@media (prefers-color-scheme:dark){ :root{ --bg:#10161D; --surface:#18202A; --ink:#E6EBF0; --muted:#9DAAB7; color-scheme:dark; } }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; text-align:center; }
.card{ background:var(--surface); border-radius:20px; padding:40px 28px; max-width:440px; width:100%; box-shadow:0 12px 32px -14px rgba(16,24,40,.25); }
img{ width:64px; height:auto; }
h1{ font-size:1.5rem; margin:16px 0 8px; }
p{ color:var(--muted); margin:0 0 24px; line-height:1.6; }
.row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
a.btn{ display:inline-block; padding:12px 20px; border-radius:999px; font-weight:600; text-decoration:none; }
.y{ background:var(--yellow); color:#151C25; }
.b{ background:var(--blue); color:#fff; }
</style>
</head>
<body>
<main class="card">
<img alt="โลโก้ บริษัท เกษรถาวร จำกัด" height="73" src="/logo.png" width="64"/>
<h1>ไม่พบหน้าที่คุณค้นหา</h1>
<p>ลิงก์อาจเปลี่ยนหรือพิมพ์ผิด กลับไปที่หน้าหลัก หรือโทรสอบถามได้เลย</p>
<div class="row">
<a class="btn y" href="/">กลับหน้าหลัก</a>
<a class="btn b" href="tel:0897423332">โทร 089-742-3332</a>
</div>
</main>
</body>
</html>
